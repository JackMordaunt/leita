# The newest GLIBC symbol version each shipped Linux executable may need,
# per kind and architecture: "<kind> <arch> <floor>". "-" declares none, and
# abi_gate.py then lists the symbols without failing; release enforcement
# (--require-floor) refuses a "-".
#
# Set each floor to the version measured on the lowered artifact, never to
# what the current build happens to need. A floor here is a ceiling for the
# build, not a promise about which systems run it: that is the guests' evidence.
#
# cli: just cli-baseline <arch> 2.17 links, and its highest symbol is GLIBC_2.14
#   on amd64 and GLIBC_2.17 on arm64 (arm64's glibc starts at 2.17). The amd64
#   build ran on CentOS 7 (glibc 2.17, Linux 3.10); arm64 was linked and read
#   back, never run on a 2.17 userspace.
# gui: the window built with zig at the 2.35 floor (release.yml) needs at most
#   GLIBC_2.34 on both architectures, and ran on Ubuntu 22.04 and Debian 12.
#
# release.yml builds the command line with just cli-baseline <arch> 2.17 and runs
# abi_gate.py --require-floor on it and on the window.
cli amd64 2.17
cli arm64 2.17
gui amd64 2.34
gui arm64 2.34
