# The newest GLIBC symbol version each shipped Linux executable may need,
# per kind and architecture: "<kind> <arch> <floor>". "-" declares none, and
# abi_gate.py then lists the symbols without failing; release enforcement
# (--require-floor) refuses a "-".
#
# Set each floor to the version measured on the lowered artifact, never to
# what the current build happens to need. Until then the shipped artifacts
# need 2.38 (cli) and 2.39 (gui).
cli amd64 -
cli arm64 -
gui amd64 -
gui arm64 -
