# Builds leita's release on a pushed v* tag: the command line and the window
# for linux/amd64, linux/arm64, windows/amd64 and a universal macOS, each
# carrying the version from the tag and the licence key from the
# LEITA_LICENCE_KEY secret, and publishes them as a GitHub Release.
#
# Every run that is not a tag is a dry run: it builds and assembles the same
# files and uploads them to the run as the artifact release-<version>, and
# creates no release. A push to a ci/release-<name> branch makes one, since
# workflow_dispatch only reaches a workflow once it is on the default branch;
# after that, `gh workflow run release.yml --ref <branch>` makes one too, and
# dispatching on a tag with dry_run unticked publishes that tag.
#
# What a release holds, for version v1.2.0:
#   leita-v1.2.0-linux-amd64.tar.zst     both binaries, the window in app/,
#   leita-v1.2.0-linux-arm64.tar.zst     LICENSE.md and THIRD_PARTY.md, for
#   leita-v1.2.0-windows-amd64.zip       a person to download; app/ since
#                                        macOS and Windows fold case, so
#                                        leita and Leita cannot share a
#                                        directory. Windows's carries the
#                                        window's SDL3.dll and accesskit.dll,
#                                        and fails the build without them.
#   leita-v1.2.0-windows-amd64-setup.exe the same files as an installer: Program
#                                        Files, a Start menu entry, an optional
#                                        PATH entry, an uninstaller; the zip and
#                                        the installer end -unsigned before the
#                                        extension when the signing secrets are
#                                        not set
#   leita-v1.2.0-linux-amd64.AppImage    the window as one file to run
#   leita-v1.2.0-linux-amd64.deb         both binaries for apt and dnf, with
#   leita-v1.2.0-linux-amd64.rpm         the desktop entry, the icon and the
#                                        recorder's unit (just package), and
#                                        the same three for linux-arm64; each
#                                        carries the notices in share/doc
#   leita-v1.2.0-darwin-universal.dmg    Leita.app, the command line inside
#                                        it and the notices in its
#                                        Contents/Resources, signed,
#                                        notarised and stapled;
#                                        -unsigned.dmg instead when the
#                                        signing secrets are not set
#   leita-<os>-<arch>[.exe]              each binary alone under a name no
#   leita-window-<os>-<arch>[.exe]       release changes, which is what
#                                        jm:selfupdate fetches from
#                                        releases/latest/download (card 547).
#   THIRD_PARTY.md                       once beside those binaries. The
#                                        archives, packages and Leita.app
#                                        each carry their own copy, and
#                                        only one dist/ adds the loose
#                                        file: the assemble job merges every
#                                        dist/ into one directory.
#   <binary>.zst, <binary>.<sha256>.patch
#                                        beside each single binary, as
#                                        brainfold publishes: its
#                                        zstd-compressed form and a patch to
#                                        it from each of the last PATCH_FROM
#                                        releases
#   leita-<version>.cdx.json             CycloneDX 1.5 for this build: leita,
#                                        the Odin pin, jm's commit, and the
#                                        notices' components
#   sha256sums.txt, version.txt          over all of the above, the file a
#                                        signature will cover
#
# A tag with a pre-release suffix (v1.0.0-rc1) is published as a draft
# pre-release, for a person to look over and publish; any other tag is
# published at once. The universal job signs and notarises Leita.app when
# the MACOS_* secrets are set, and the Windows job signs leita.exe, Leita.exe
# and the installer when the WINDOWS_SIGN_* secrets are (see "windows signing
# plan" below). Other signing is left to the card that owns it:
# sha256sums.txt.sig (jm:selfupdate, card 547).
#
# The Linux window carries SDL3 inside it and opens libcurl only to activate
# a licence, so it needs nothing a stock desktop lacks but glibc and
# libstdc++: built on ubuntu-24.04, it needs glibc 2.39 (AccessKit's Rust
# std refers to pidfd_spawnp, and the C built against 24.04's headers to
# C23's __isoc23_strtol, 2.38), so it runs on Ubuntu 24.04 and Fedora 40
# and later, and not on Debian 12 (2.36) or Ubuntu 22.04 (2.35). The build
# step prints the version it needs. Reaching those would take building
# Linux on ubuntu-22.04 with AccessKit built there from source, as arm64's
# is (ASSUMPTION: its CMake builds SDL3 and Blend2D unchanged), or linking
# with `zig cc -target x86_64-linux-gnu.2.35` in place of Odin's clang.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/release-*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Upload the assets to the run and create no release (a branch is always a dry run)
        type: boolean
        default: true

# A second run for the same ref waits rather than cancelling the first,
# which may be halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides once what every later job reads: the version, whether this is a
  # dry run, whether the tag is a pre-release. A run that would publish
  # stops here, before four builds, when the licence key is missing.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      test_key: ${{ steps.plan.outputs.test_key }}
    steps:
      # The justfile alone, for the test key a release must not carry.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: justfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        env:
          # Empty on a push, so a pushed tag is never a dry run.
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          LEITA_LICENCE_KEY: ${{ secrets.LEITA_LICENCE_KEY }}
        run: |
          set -euo pipefail
          dry_run=true
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$DISPATCH_DRY_RUN" != true ]; then dry_run=false; fi
          # The tag as git describe would name it locally, or a bare commit
          # as the justfile names one: g and its hash, so Odin never reads
          # the define as a number. Only letters, digits, dots, dashes and
          # underscores, since it lands in -define: and in file names.
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version="g${GITHUB_SHA::9}"; fi
          if ! [[ $version =~ ^[A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::$version cannot name a release: a letter, then letters, digits, dots, dashes or underscores"
            exit 1
          fi
          if [ "$dry_run" = false ] && ! [[ $version =~ ^v[0-9] ]]; then
            echo "::error::a release is published from a v<number> tag, not $version"
            exit 1
          fi
          prerelease=false
          if [[ $version == *-* ]]; then prerelease=true; fi
          test_key=$(sed -n 's/^test_licence_key *:= *"\([0-9a-fA-F]*\)".*/\1/p' justfile)
          [ -n "$test_key" ] || { echo "::error::no test_licence_key in the justfile"; exit 1; }
          # A release built without the real key takes no licence, and one
          # built with the test key takes the licence anyone can read in the
          # justfile: neither may ship. A dry run without the secret builds
          # with the test key, and says so, below.
          if [ "$dry_run" = false ]; then
            if ! [[ $LEITA_LICENCE_KEY =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::the LEITA_LICENCE_KEY secret must hold the licence public key, 64 hex characters"
              exit 1
            fi
            if [ "${LEITA_LICENCE_KEY,,}" = "${test_key,,}" ]; then
              echo "::error::the LEITA_LICENCE_KEY secret holds the justfile's test key"
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
            echo "test_key=$test_key"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, dry run $dry_run, pre-release $prerelease"

  # Each target on a runner of its own architecture. Odin can cross-compile,
  # but the window links native libraries built per target, and Linux on
  # arm64 would need an arm64 sysroot holding libc, libcurl and SDL3; a
  # native runner builds every library with the recipes test.yml uses.
  # macOS is built on both architectures and joined by the universal job.
  # The runner images are named, not -latest, so a release builds against
  # the same systems until this file says otherwise.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
            artifact: dist-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: dist-linux-arm64
          - os: windows-2025
            target: windows-amd64
            artifact: dist-windows-amd64
            exe: .exe
          - os: macos-26
            target: darwin-arm64
            artifact: darwin-arm64
          - os: macos-26-intel
            target: darwin-amd64
            artifact: darwin-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LEITA_VERSION: ${{ needs.plan.outputs.version }}
      # Prefixed, since make and cargo, which the setup action runs, read
      # TARGET from the environment themselves.
      LEITA_TARGET: ${{ matrix.target }}
      LEITA_EXE: ${{ matrix.exe }}
    steps:
      # As test.yml: the bytes built are the bytes committed.
      - name: keep line endings as committed (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      # Built fresh, never from the cache: see the action's cache input.
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      # The justfile embeds LEITA_VERSION and the key. Each binary is then
      # searched for the key it was given, which the licence package keeps
      # as its hex text, and a release's for the test key, so nothing the
      # plan job missed reaches a release.
      - name: build
        env:
          LEITA_LICENCE_KEY: ${{ secrets.LEITA_LICENCE_KEY }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          test_key=$(just --evaluate test_licence_key)
          if [ -z "$LEITA_LICENCE_KEY" ]; then
            if [ "$DRY_RUN" != true ]; then echo "::error::no LEITA_LICENCE_KEY for a release"; exit 1; fi
            echo "::warning::LEITA_LICENCE_KEY is unset: this dry run carries the justfile's test key and must never ship"
            LEITA_LICENCE_KEY=$test_key
          fi
          export LEITA_LICENCE_KEY
          just build release
          for bin in "build/release/leita$LEITA_EXE" "build/release/app/Leita$LEITA_EXE"; do
            grep -aqiF "$LEITA_LICENCE_KEY" "$bin" || { echo "::error::$bin does not carry the licence key"; exit 1; }
            if [ "$DRY_RUN" != true ] && grep -aqiF "$test_key" "$bin"; then
              echo "::error::$bin carries the test key"
              exit 1
            fi
          done
          line=$("build/release/leita$LEITA_EXE" --version)
          echo "$line"
          case "$line" in
            "leita $LEITA_VERSION "*) ;;
            *) echo "::error::--version names another version than $LEITA_VERSION"; exit 1 ;;
          esac
          # The Windows window is a GUI program, so that starting it opens
          # no console behind it (the PE header's subsystem is 2, a console
          # program's 3), and it still answers as leita when given a flag.
          if [ "$RUNNER_OS" = Windows ]; then
            pe=$(od -An -tu4 -j60 -N4 "build/release/app/Leita.exe")
            subsystem=$(od -An -tu2 -j$((pe + 24 + 68)) -N2 "build/release/app/Leita.exe" | tr -d ' ')
            [ "$subsystem" = 2 ] || { echo "::error::Leita.exe is subsystem $subsystem, not 2 (Windows GUI)"; exit 1; }
            line=$("build/release/app/Leita.exe" --version)
            echo "$line"
            case "$line" in
              "leita $LEITA_VERSION "*) ;;
              *) echo "::error::Leita.exe --version names another version than $LEITA_VERSION"; exit 1 ;;
            esac
          fi
          # The Linux window must start where neither SDL3 nor libcurl is
          # installed: neither may be among what it loads. Nor may the
          # command line, which opens libcurl only for leita update.
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "build/release/app/Leita"
            if ldd "build/release/app/Leita" | grep -E 'libSDL3|libcurl'; then
              echo "::error::the window links a shared SDL3 or libcurl"
              exit 1
            fi
            if ldd "build/release/leita" | grep -E 'libcurl'; then
              echo "::error::the command line links a shared libcurl"
              exit 1
            fi
            echo "glibc needed: $(objdump -T build/release/app/Leita build/release/leita | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          fi
          if [ "$RUNNER_OS" = macOS ]; then otool -L "build/release/app/Leita"; fi

      # Authenticode signing, so a downloaded exe is not an unknown
      # publisher's: Jack's decision (card 541) is an OV code-signing
      # certificate whose key lives in a cloud HSM. One route is chosen from
      # the secrets, by tools/windows/sign.sh:
      #   WINDOWS_SIGN_AKV_URL, _CERT, _TENANT, _CLIENT_ID, _CLIENT_SECRET
      #     all five: the certificate is in Azure Key Vault (Premium or
      #     Managed HSM) and AzureSignTool signs through the vault, so the
      #     key never reaches the runner. AzureSignTool is the common route
      #     for an OV certificate whose key is in a cloud HSM (DigiCert
      #     KeyLocker's smctl is the other, and is not wired here).
      #   WINDOWS_SIGN_CERT_THUMBPRINT
      #     a certificate already in the runner's personal store, as a
      #     hardware vendor's client leaves one: signtool signs with it.
      # With none set, as on a fork or before the certificate is bought, the
      # build ships unsigned under a notice, and the zip and installer carry
      # -unsigned in their names. Both routes, or some but not all of the
      # five, are a mistake, and fail. The update binaries keep the names
      # jm:selfupdate fetches, signed or not. Each file is timestamped, so
      # its signature outlives the certificate, and verified with
      # signtool verify /pa, as Windows judges it.
      - name: windows signing plan
        if: runner.os == 'Windows'
        id: signplan
        env:
          WINDOWS_SIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
          WINDOWS_SIGN_AKV_URL: ${{ secrets.WINDOWS_SIGN_AKV_URL }}
          WINDOWS_SIGN_AKV_CERT: ${{ secrets.WINDOWS_SIGN_AKV_CERT }}
          WINDOWS_SIGN_AKV_TENANT: ${{ secrets.WINDOWS_SIGN_AKV_TENANT }}
          WINDOWS_SIGN_AKV_CLIENT_ID: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_ID }}
          WINDOWS_SIGN_AKV_CLIENT_SECRET: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          akv=0
          for name in WINDOWS_SIGN_AKV_URL WINDOWS_SIGN_AKV_CERT WINDOWS_SIGN_AKV_TENANT WINDOWS_SIGN_AKV_CLIENT_ID WINDOWS_SIGN_AKV_CLIENT_SECRET; do
            if [ -n "${!name}" ]; then akv=$((akv + 1)); fi
          done
          if [ "$akv" != 0 ] && [ "$akv" != 5 ]; then
            echo "::error::$akv of the 5 WINDOWS_SIGN_AKV_* secrets are set; set all or none"
            exit 1
          fi
          if [ "$akv" = 5 ] && [ -n "$WINDOWS_SIGN_CERT_THUMBPRINT" ]; then
            echo "::error::both WINDOWS_SIGN_CERT_THUMBPRINT and the WINDOWS_SIGN_AKV_* secrets are set; choose one route"
            exit 1
          fi
          route=none
          if [ "$akv" = 5 ]; then route=akv; elif [ -n "$WINDOWS_SIGN_CERT_THUMBPRINT" ]; then route=store; fi
          if [ "$route" = none ]; then
            echo "::notice::no WINDOWS_SIGN_* secrets: leita.exe, Leita.exe and the installer are not signed, and the archive and installer ship as -unsigned; SmartScreen will warn"
            echo "LEITA_UNSIGNED=-unsigned" >> "$GITHUB_ENV"
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "signing route: $route"
      # Pinned by version and by the SHA-256 of the release asset, which
      # was computed from the download itself (GitHub's digest agrees).
      - name: AzureSignTool
        if: steps.signplan.outputs.route == 'akv'
        env:
          AZURESIGNTOOL_VERSION: v7.0.1
          AZURESIGNTOOL_SHA256: dc85a3f24bcd5978c63fcfd167a9b41313af9116722b99b831400f05f387fcba
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/AzureSignTool.exe"
          curl -fsSL --max-time 120 -o "$tool" "https://github.com/vcsjones/AzureSignTool/releases/download/$AZURESIGNTOOL_VERSION/AzureSignTool-x64.exe"
          echo "$AZURESIGNTOOL_SHA256  $tool" | sha256sum -c -
          echo "AZURESIGNTOOL=$tool" >> "$GITHUB_ENV"
      # The two executables, before they are copied into the archive, the
      # installer and the update names.
      - name: sign leita.exe and Leita.exe
        if: steps.signplan.outputs.route != 'none' && runner.os == 'Windows'
        env:
          WINDOWS_SIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
          WINDOWS_SIGN_AKV_URL: ${{ secrets.WINDOWS_SIGN_AKV_URL }}
          WINDOWS_SIGN_AKV_CERT: ${{ secrets.WINDOWS_SIGN_AKV_CERT }}
          WINDOWS_SIGN_AKV_TENANT: ${{ secrets.WINDOWS_SIGN_AKV_TENANT }}
          WINDOWS_SIGN_AKV_CLIENT_ID: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_ID }}
          WINDOWS_SIGN_AKV_CLIENT_SECRET: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_SECRET }}
          ROUTE: ${{ steps.signplan.outputs.route }}
        run: tools/windows/sign.sh "$ROUTE" build/release/leita.exe build/release/app/Leita.exe

      # Each binary under its update name, and on Linux and Windows the
      # archive a person downloads. macOS's go to the universal job as they
      # are. cp fails on a missing DLL, as the justfile's gui recipe does.
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/release/leita$LEITA_EXE" "dist/leita-$LEITA_TARGET$LEITA_EXE"
          cp "build/release/app/Leita$LEITA_EXE" "dist/leita-window-$LEITA_TARGET$LEITA_EXE"
          # The notices travel with the licence. The archives are packed
          # here; the packages and the macOS bundle take them from the tree.
          # linux-amd64 also leaves one loose THIRD_PARTY.md in dist/, which
          # becomes the copy beside the single binaries. Every dist/ is
          # merged into one directory, so a second job must not add the file.
          if [ "$LEITA_TARGET" = linux-amd64 ]; then cp THIRD_PARTY.md dist/; fi
          case "$LEITA_TARGET" in darwin-*) exit 0 ;; esac
          root="leita-$LEITA_VERSION-$LEITA_TARGET"
          mkdir -p "pack/$root/app"
          cp "build/release/leita$LEITA_EXE" LICENSE.md THIRD_PARTY.md "pack/$root/"
          cp "build/release/app/Leita$LEITA_EXE" "pack/$root/app/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/release/app/SDL3.dll build/release/app/accesskit.dll "pack/$root/app/"
            # The third-party notices card 545 adds; until it lands the
            # archive goes without them.
            if [ -f THIRD_PARTY.md ]; then
              cp THIRD_PARTY.md "pack/$root/"
            else
              echo "::notice::no THIRD_PARTY.md yet (card 545): the archive goes without it"
            fi
            zip="dist/$root${LEITA_UNSIGNED:-}.zip"
            (cd pack && 7z a -tzip -bso0 -bsp0 "../$zip" "$root")
            # What a person unzips: the window must have both DLLs beside it.
            listing=$(7z l -ba "$zip")
            listing=${listing//\\//}
            for f in leita.exe LICENSE.md app/Leita.exe app/SDL3.dll app/accesskit.dll; do
              grep -qF "$root/$f" <<<"$listing" || { echo "::error::$zip lacks $f"; exit 1; }
            done
          else
            command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
            tar -C pack --owner=0 --group=0 --numeric-owner -cf - "$root" | zstd -q -19 -T0 -o "dist/$root.tar.zst"
          fi
          ls -l dist

      # The installer, from the tree the zip was made from: Program Files,
      # a Start menu shortcut carrying the AppUserModelID, an optional PATH
      # entry, an uninstaller (tools/windows/leita.iss). Inno Setup is on
      # the runner image, so nothing is downloaded and there is nothing to
      # pin. Then it is run as a person would, silently: installed, the
      # files and the shortcut are there, the window's DLLs beside it, the
      # PATH names the folder; uninstalled, all of that is gone again.
      - name: installer (windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          iscc=""
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [ -x "$candidate" ]; then iscc=$candidate; break; fi
          done
          [ -n "$iscc" ] || { echo "::error::Inno Setup 6 is not on this runner image"; exit 1; }
          root="leita-$LEITA_VERSION-$LEITA_TARGET"
          name="$root-setup${LEITA_UNSIGNED:-}"
          # The file's version resource takes four numbers: v1.2.0-rc1 is
          # 1.2.0.0, and a bare commit, g and its hash, is 0.0.0.0.
          number=0.0.0
          v=${LEITA_VERSION#v}
          if [[ $v =~ ^[0-9]+(\.[0-9]+){0,2} ]]; then number=${BASH_REMATCH[0]}; fi
          while [ "$(tr -cd . <<<"$number" | wc -c)" -lt 3 ]; do number+=.0; done
          # Git Bash would rewrite ISCC's /Q as a path.
          MSYS_NO_PATHCONV=1 LEITA_PACK=$(cygpath -w "$PWD/pack/$root") LEITA_NUMBER=$number \
            LEITA_OUT=$(cygpath -w "$PWD/dist") LEITA_OUTNAME=$name \
            "$iscc" /Q tools/windows/leita.iss
          [ -s "dist/$name.exe" ] || { echo "::error::Inno Setup wrote no dist/$name.exe"; exit 1; }
      - name: sign the installer
        if: steps.signplan.outputs.route != 'none' && runner.os == 'Windows'
        env:
          WINDOWS_SIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
          WINDOWS_SIGN_AKV_URL: ${{ secrets.WINDOWS_SIGN_AKV_URL }}
          WINDOWS_SIGN_AKV_CERT: ${{ secrets.WINDOWS_SIGN_AKV_CERT }}
          WINDOWS_SIGN_AKV_TENANT: ${{ secrets.WINDOWS_SIGN_AKV_TENANT }}
          WINDOWS_SIGN_AKV_CLIENT_ID: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_ID }}
          WINDOWS_SIGN_AKV_CLIENT_SECRET: ${{ secrets.WINDOWS_SIGN_AKV_CLIENT_SECRET }}
          ROUTE: ${{ steps.signplan.outputs.route }}
        run: tools/windows/sign.sh "$ROUTE" "dist/leita-$LEITA_VERSION-$LEITA_TARGET-setup.exe"
      - name: installer on a clean system (windows)
        if: runner.os == 'Windows'
        env:
          # Git Bash would rewrite /VERYSILENT and the like as paths.
          MSYS_NO_PATHCONV: 1
        run: |
          set -euo pipefail
          setup="dist/leita-$LEITA_VERSION-$LEITA_TARGET-setup${LEITA_UNSIGNED:-}.exe"
          dir='C:\leita-setup-test'
          machine_path() { reg query 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' /v Path; }
          "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/LOG=$(cygpath -w "$RUNNER_TEMP/install.log")" "/DIR=$dir" /TASKS=addtopath
          for f in leita.exe LICENSE.md app/Leita.exe app/SDL3.dll app/accesskit.dll unins000.exe; do
            [ -f "/c/leita-setup-test/$f" ] || { echo "::error::the installer left no $f"; exit 1; }
          done
          /c/leita-setup-test/leita.exe --version
          # Git Bash spells Windows's environment names as Windows does, so
          # it is ProgramData here, not PROGRAMDATA, which set -u refuses.
          shortcut="${ProgramData:-/c/ProgramData}/Microsoft/Windows/Start Menu/Programs/Leita.lnk"
          [ -f "$shortcut" ] || { echo "::error::the installer left no Start menu shortcut"; exit 1; }
          grep -qiF 'leita-setup-test' <<<"$(machine_path)" \
            || { echo "::error::the PATH task did not add the install folder"; exit 1; }
          # What notify.odin looks for to name toasts Leita: the shell lists
          # the shortcut under its AppUserModelID.
          apps=$(powershell -NoProfile -Command "Get-StartApps | Where-Object AppID -eq 'Librium.Leita' | Format-List | Out-String")
          echo "$apps"
          grep -qF 'Librium.Leita' <<<"$apps" || echo "::warning::Get-StartApps does not list Librium.Leita: toasts will fall back to PowerShell's name"

          # _?= keeps the uninstaller in place, but its process is still
          # waited for here by name, since the checks below race it if it
          # is not done: the files go before the last uninstall step runs.
          "$dir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /REMOVEDATA "/LOG=$(cygpath -w "$RUNNER_TEMP/uninstall.log")" "_?=$dir"
          for _ in $(seq 60); do
            running=$(tasklist /FI "IMAGENAME eq unins000.exe" 2>&1 || true)
            grep -qi unins000 <<<"$running" || break
            sleep 1
          done
          [ ! -e /c/leita-setup-test/leita.exe ] || { echo "::error::the uninstaller left leita.exe"; exit 1; }
          [ ! -e "$shortcut" ] || { echo "::error::the uninstaller left the Start menu shortcut"; exit 1; }
          after=$(machine_path)
          if grep -qiF 'leita-setup-test' <<<"$after"; then
            echo "::error::the uninstaller left the install folder on the PATH"
            echo "the machine Path it read:"
            echo "$after"
            echo "the uninstaller's log:"
            cat "$RUNNER_TEMP/uninstall.log" || true
            exit 1
          fi
          rm -rf /c/leita-setup-test
          ls -l dist

      # The AppImage, .deb and .rpm, from the binaries built above, with
      # the desktop entry and AppStream metadata checked first, by the tools
      # the distributions check them with.
      - name: linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/linux/dev.mordaunt.Leita.desktop
          appstreamcli validate --no-net packaging/linux/dev.mordaunt.Leita.metainfo.xml
          just package-built
          cp build/package/* dist/
          ls -l dist

      # What a stock system makes of them, in its own container image,
      # pinned by digest: the .deb on Ubuntu 24.04 and the .rpm on Fedora
      # 42 install with nothing else, both binaries start (--version runs
      # the window as leita, through the same loader and libraries), and
      # removing the package removes the recorder's unit. Then the window
      # itself, on this runner, which has no SDL3: it must still be
      # running on a virtual X display after 10 seconds.
      - name: linux packages on stock systems
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb) rpm=$(ls dist/*.rpm)
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            sh -euc "dpkg -i /dist/${deb#dist/}; leita --version; Leita --version; dpkg -r leita; test ! -e /usr/lib/systemd/system/leita-journal.service"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            sh -euc "rpm -i /dist/${rpm#dist/}; leita --version; Leita --version; rpm -e leita; test ! -e /usr/lib/systemd/system/leita-journal.service"
          sudo apt-get install -y --no-install-recommends xvfb
          status=0
          xvfb-run -a timeout 10 build/release/app/Leita "$RUNNER_TEMP" || status=$?
          if [ "$status" != 124 ]; then
            echo "::error::the window exited with $status on X before 10 seconds were up"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

      # jm's mkpatch, built once for the assemble job, which has no Odin of
      # its own; it links the zstd archive jm's recipe builds.
      - name: mkpatch
        if: matrix.target == 'linux-amd64'
        run: |
          (cd jm && just zstd)
          odin build jm/tools/mkpatch -o:speed -vet -strict-style -collection:jm="$PWD/jm" -out:build/release/mkpatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.target == 'linux-amd64'
        with:
          name: mkpatch
          path: build/release/mkpatch
          if-no-files-found: error

  # One macOS binary for both architectures, joined with lipo: each slice
  # is a whole linked executable with the static SDL3 already inside, and
  # keeps the ad-hoc signature its linker gave it. The universal pair are
  # the update binaries, and just bundle puts them in Leita.app, which ships
  # signed and notarised in a .dmg. Run on arm64, where the arm64 slice
  # runs; the build job ran the x86_64 one natively.
  universal:
    needs: [plan, build]
    runs-on: macos-26
    env:
      LEITA_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # The justfile, the icon, tools/macos and the notices alone, for just bundle; the
      # binaries come from the build job, so no Odin and no jm.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            justfile
            branding/icon.png
            tools/macos
            LICENSE.md
            THIRD_PARTY.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.58.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: darwin-*
          path: bin
          merge-multiple: true
      - name: lipo
        run: |
          set -euo pipefail
          mkdir -p dist
          for name in leita leita-window; do
            out="dist/$name-darwin-universal"
            lipo -create -output "$out" "bin/$name-darwin-arm64" "bin/$name-darwin-amd64"
            chmod +x "$out"
            archs=$(lipo -archs "$out")
            echo "$out: $archs"
            # lipo prints the slices space-separated; each is looked for on
            # its own, since one pattern cannot share the space between them.
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$out is $archs"; exit 1 ;; esac
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$out is $archs"; exit 1 ;; esac
          done
          dist/leita-darwin-universal --version
      - name: bundle
        run: |
          set -euo pipefail
          just bundle dist/leita-window-darwin-universal dist/leita-darwin-universal
          app=build/release/Leita.app
          for f in Info.plist MacOS/Leita Helpers/leita Resources/Leita.icns Resources/LICENSE.md Resources/THIRD_PARTY.md; do
            [ -s "$app/Contents/$f" ] || { echo "::error::$app has no Contents/$f"; exit 1; }
          done
          plutil -p "$app/Contents/Info.plist"
          "$app/Contents/Helpers/leita" --version

      # Signed with the Developer ID Application certificate and notarised
      # when every MACOS_* secret below is set; with none set, as on a fork
      # or before the certificate exists, the .app is signed ad hoc, which
      # seals the bundle so Gatekeeper offers Open Anyway rather than calling
      # it damaged, and ships as -unsigned.dmg under a notice. Some but not
      # all set is a mistake, and fails. MACOS_SIGNING_IDENTITY may be left
      # unset: the certificate's own Developer ID Application identity is
      # used. The certificate lives only in a keychain made for this run,
      # deleted in the next step.
      #
      # The .app is notarised and stapled on its own before it goes in the
      # .dmg, and the .dmg after: a ticket stapled to the .app travels with
      # it once dragged to Applications, so a Mac offline at first launch
      # still opens it, and the .dmg's own ticket covers the mount.
      # Helpers/leita is signed before the bundle around it, as nested code
      # must be; --deep would sign it with the window's entitlements, which
      # it does not need.
      - name: sign, notarise and dmg
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          app=build/release/Leita.app
          entitlements=tools/macos/Leita.entitlements
          set_count=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            if [ -n "${!name}" ]; then set_count=$((set_count + 1)); fi
          done
          case $set_count in
            0) signed=false ;;
            5) signed=true ;;
            *) echo "::error::$set_count of the 5 MACOS_* signing and notary secrets are set; set all or none"; exit 1 ;;
          esac

          # notarise submits a file and waits for Apple's verdict, failing
          # with Apple's log unless it is Accepted: notarytool's own exit
          # status says only that the submission went through.
          notarise() {
            local result id status
            result=$(xcrun notarytool submit "$1" --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --wait --output-format json)
            id=$(plutil -extract id raw -o - - <<<"$result")
            status=$(plutil -extract status raw -o - - <<<"$result")
            echo "notarytool: $1: $status ($id)"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" || true
              echo "::error::notarisation of $1 was $status"
              exit 1
            fi
          }

          if [ "$signed" = true ]; then
            keychain="$RUNNER_TEMP/leita-signing.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            base64 --decode <<<"$MACOS_CERTIFICATE_P12" > "$RUNNER_TEMP/leita-signing.p12"
            security import "$RUNNER_TEMP/leita-signing.p12" -k "$keychain" -f pkcs12 \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/leita-signing.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
            # The search list gains the new keychain, keeping the runner's
            # own, which hold Apple's intermediate certificates.
            # A read loop, not mapfile: the job's bash may be the system's 3.2.
            keychains=()
            while IFS= read -r line; do keychains+=("$line"); done < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
            security list-keychains -d user -s "$keychain" "${keychains[@]}"
            identity=$MACOS_SIGNING_IDENTITY
            if [ -z "$identity" ]; then
              identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
            fi
            [ -n "$identity" ] || { echo "::error::the certificate holds no Developer ID Application identity"; exit 1; }
            sign=(codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity")
          else
            echo "::notice::no MACOS_* signing secrets: Leita.app is signed ad hoc, not notarised, and ships as -unsigned.dmg; Gatekeeper will stop it at first launch"
            sign=(codesign --force --options runtime --sign -)
          fi

          "${sign[@]}" "$app/Contents/Helpers/leita"
          "${sign[@]}" --entitlements "$entitlements" "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"

          if [ "$signed" = true ]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Leita.zip"
            notarise "$RUNNER_TEMP/Leita.zip"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            dmg="dist/leita-$LEITA_VERSION-darwin-universal.dmg"
          else
            dmg="dist/leita-$LEITA_VERSION-darwin-universal-unsigned.dmg"
          fi

          # A plain disk image: the .app, and a link to /Applications to
          # drag it onto.
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/Leita.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Leita -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"

          if [ "$signed" = true ]; then
            codesign --force --timestamp --keychain "$keychain" --sign "$identity" "$dmg"
            notarise "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          fi
          hdiutil verify "$dmg"
          # What a person gets: the image mounts, holds the link, and the
          # window inside it runs, as leita does when given a flag.
          mount="$RUNNER_TEMP/leita-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          [ -L "$mount/Applications" ] || { echo "::error::$dmg has no Applications link"; exit 1; }
          "$mount/Leita.app/Contents/MacOS/Leita" --version
          codesign --verify --strict "$mount/Leita.app"
          hdiutil detach "$mount"
          ls -l dist
      - name: delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/leita-signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-darwin-universal
          path: dist
          if-no-files-found: error

  # Everything a release holds, uploaded to the run as one artifact: a dry
  # run's result, and what the release job publishes. Read-only: earlier
  # releases are read, nothing is written.
  assemble:
    needs: [plan, build, universal]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # How many earlier releases a tag publishes patches from. Pre-releases
      # count too, once published: a machine on an rc updates by patch like
      # any other. Drafts are not listed, since nobody runs one.
      PATCH_FROM: "3"
    steps:
      # The SBOM is written from this checkout: the notices, the Odin pin
      # in the setup action, and jm's gitlink. The submodule's files are
      # not read, so it is not checked out. Downloading mkpatch into tools/
      # afterwards only adds that binary.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mkpatch
          path: tools
      # Beside each update binary, mkpatch writes its zstd-compressed form
      # and a patch to it from the same binary in each of the last
      # PATCH_FROM releases, named <binary>.<old sha256>.patch so a binary
      # finds the one for itself by its own hash; it skips a patch that
      # would not beat the compressed binary. The old builds are the
      # published files, since a rebuild is not the same bytes. The
      # archives get neither: they are compressed already, and nothing
      # updates from them. A first release ships the compressed binaries
      # alone.
      - name: compressed binaries and patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x tools/mkpatch
          binaries=()
          for f in assets/leita-*; do
            name=${f#assets/}
            case "$name" in "leita-$VERSION-"*) ;; *) binaries+=("$name") ;; esac
          done
          mapfile -t tags < <(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --exclude-drafts --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n "$PATCH_FROM")
          echo "patches from: ${tags[*]:-none}"
          patterns=()
          for name in "${binaries[@]}"; do patterns+=(-p "$name"); done
          for tag in "${tags[@]}"; do
            mkdir -p "old/$tag"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "old/$tag" "${patterns[@]}" || true
          done
          for name in "${binaries[@]}"; do
            olds=()
            for tag in "${tags[@]}"; do if [ -f "old/$tag/$name" ]; then olds+=(-old "old/$tag/$name"); fi; done
            tools/mkpatch -new "assets/$name" -out assets "${olds[@]}"
          done
      # After the patches. mkpatch treats every leita-* name that is not an
      # archive (leita-<version>-*) as a binary to compress, and
      # leita-<version>.cdx.json is not an archive. The assemble job has no
      # Odin; tools/sbom reads the notices and the pin from the checkout.
      - name: sbom
        env:
          LEITA_VERSION: ${{ needs.plan.outputs.version }}
        run: tools/sbom > "assets/leita-$LEITA_VERSION.cdx.json"
      - name: sha256sums
        working-directory: assets
        run: |
          set -euo pipefail
          # leita-* is the binaries, the archives, their compressed forms
          # and the SBOM. THIRD_PARTY.md is the loose copy beside the
          # single binaries; without it here the signature would not cover
          # that file.
          sha256sum leita-* THIRD_PARTY.md > sha256sums.txt
          echo "$VERSION" > version.txt
          cat sha256sums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: assets
          if-no-files-found: error

  # The only job that writes: it creates the release from the assembled
  # artifact with the runner's own gh, no third-party uploader. It checks
  # the key once more itself, so no path to it skips that check.
  release:
    needs: [plan, assemble]
    if: needs.plan.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: licence key
        env:
          LEITA_LICENCE_KEY: ${{ secrets.LEITA_LICENCE_KEY }}
          TEST_KEY: ${{ needs.plan.outputs.test_key }}
        run: |
          set -euo pipefail
          # An empty TEST_KEY would make the second test pass anything.
          [ -n "$TEST_KEY" ] || { echo "::error::the plan job named no test key"; exit 1; }
          if ! [[ $LEITA_LICENCE_KEY =~ ^[0-9a-fA-F]{64}$ ]] || [ "${LEITA_LICENCE_KEY,,}" = "${TEST_KEY,,}" ]; then
            echo "::error::the LEITA_LICENCE_KEY secret is unset, malformed or the test key; nothing is published"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: assets
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags=(--draft --prerelease); fi
          gh release create "$VERSION" assets/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Leita $VERSION" --generate-notes "${flags[@]}"
