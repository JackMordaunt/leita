# Ephemeral validation for card 780; source stays at 6ef517a0.
name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-journeys:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: five complete Windows journeys suites
        run: |
          set -euo pipefail
          # Odin removes test executables unless explicitly retained for replay.
          export SAN=-keep-executable
          root="$(just --evaluate root)"
          export LEITA_BIN="$root/build/journeys/leita.exe"
          export LEITA_TEST_LICENCE="$(just --evaluate test_licence)"
          # The cached binaries include every journey only with no held tests.
          if sed -e 's/#.*//' -e 's/[[:space:]]//g' journeys/quarantine | grep -q '[^[:space:]]'; then
            echo 'Cached replay requires an empty journey quarantine' >&2
            exit 1
          fi
          mkdir -p build/journeys/artifacts
          for iteration in 1 2 3 4 5; do
            export LEITA_JOURNEY_ARTIFACTS="$root/build/journeys/artifacts/run-$iteration"
            mkdir -p "$LEITA_JOURNEY_ARTIFACTS"
            log="$LEITA_JOURNEY_ARTIFACTS/journeys.log"
            echo "Windows journeys iteration $iteration/5"
            if [ "$iteration" = 1 ]; then
              # Build and run both suites with the committed recipe and flags.
              just journeys 2>&1 | tee "$log"
              test -f build/test/journeys.exe
              test -f build/test/journeys-gui.exe
            else
              # Replay those same test binaries with the recipe's environment.
              build/test/journeys.exe 2>&1 | tee "$log"
              build/test/journeys-gui.exe 2>&1 | tee -a "$log"
            fi
            echo "$iteration success $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a build/journeys/artifacts/results.txt
            echo "- Windows journeys iteration $iteration: success" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card780-windows-five-suites
          path: build/journeys/artifacts
          if-no-files-found: error
          retention-days: 14
