# Builds and tests leita on Linux, macOS and Windows, on every push to main,
# every push to a ci/<name> branch (so a throwaway branch gets the three
# platforms before it lands: `git push github HEAD:ci/<name>`), and every
# pull request.
#
# The toolchain and the native libraries come from the setup action
# (.github/actions/setup), which release.yml builds with too, so what is
# tested is what ships; its header says where Odin and each library come
# from, and how to move the Odin pin.
name: test

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The Windows runner's git converts line endings on checkout; leita's
      # tests that compare file bytes would otherwise read CRLF where they
      # wrote LF.
      - name: keep line endings as committed (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # jm is a submodule, over https so the runner needs no key for it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: packaging manifests (linux and windows)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            MANIFEST_TEST_BASH=$(cygpath -w "$BASH")
            export MANIFEST_TEST_BASH
          fi
          python -m unittest discover -s packaging -p 'test_*.py'
      - name: compatibility tools
        run: |
          python -m unittest discover -s tools/macos -p 'test_*.py'
      # Odin, just, SDL3 on Linux and jm's native libraries, cached.
      - uses: ./.github/actions/setup

      # Type-check both modes. leita's own `check` recipe has no -target:,
      # so it only sees this host's files; the matrix running it on all
      # three OSes is what actually type-checks history/platform_windows.odin,
      # platform_darwin.odin and platform_linux.odin and gui/files' equivalents.
      - name: check
        run: just check
      # Windows runs without AddressSanitizer: its HeapSize hook aborts
      # inside combase.dll and windows.storage.dll on memory Windows
      # allocated itself, not leita's.
      - name: test
        timeout-minutes: 20
        run: |
          if [ "${{ runner.os }}" = Windows ]; then export SAN=; fi
          just test
      # The btrfs and walk tests again on a btrfs image, mounted with the
      # runner's passwordless sudo and run both as the runner and as root,
      # since only root may read a file's extents. tools/btrfs-fixture says
      # how the expected total is worked out from the image.
      - name: btrfs-test (linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: just btrfs-test --sudo
      # Warm walk of a seeded tmpfs against the committed baseline. A median
      # past the tolerance fails the job. Ubuntu only; tools/fsbench --ci
      # mounts the tmpfs. The command line, the seed and a few runs stay
      # under a minute.
      - name: fsbench (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        run: just fsbench-ci
      - name: gui-test
        timeout-minutes: 20
        run: |
          if [ "${{ runner.os }}" = Windows ]; then export SAN=; fi
          just gui-test
      # A release checks licences against the public key it is built with,
      # and its recipes refuse to build without one: first that refusal, then
      # the build, with the key the repository secret LEITA_LICENCE_KEY holds,
      # a throwaway one, or the justfile's test key where no secret reaches
      # (a pull request from a fork). Then a build with the test key is shown
      # to take the licence that key signed.
      - name: release
        env:
          LEITA_LICENCE_KEY: ${{ secrets.LEITA_LICENCE_KEY }}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then export SAN=; fi
          if LEITA_LICENCE_KEY='' LEITA_UPDATE_KEY='' just cli release; then
            echo "release: built without a licence key" >&2
            exit 1
          fi
          # The update key is required on its own. Fixture CI uses the public
          # test key and never the production seed.
          if LEITA_LICENCE_KEY="$(just --evaluate test_licence_key)" LEITA_UPDATE_KEY='' just cli release; then
            echo "release: built without an update key" >&2
            exit 1
          fi
          LEITA_LICENCE_KEY="${LEITA_LICENCE_KEY:-$(just --evaluate test_licence_key)}"
          LEITA_UPDATE_KEY="$(just --evaluate test_update_key)"
          export LEITA_LICENCE_KEY LEITA_UPDATE_KEY
          just build release
          # Built with the test key, the release binary takes its licence.
          if [ "$LEITA_LICENCE_KEY" = "$(just --evaluate test_licence_key)" ]; then
            LEITA_LICENCE="$(just --evaluate test_licence)" build/release/leita licence
          fi
      - name: check-licence
        run: |
          if [ "${{ runner.os }}" = Windows ]; then export SAN=; fi
          just check-licence
