# Builds and tests leita on Linux, macOS and Windows, on every push to main,
# every push to a ci/<name> branch (so a throwaway branch gets the three
# platforms before it lands: `git push github HEAD:ci/<name>`), and every
# pull request.
#
# The toolchain and the native libraries come from the setup action
# (.github/actions/setup), which release.yml builds with too, so what is
# tested is what ships; its header says where Odin and each library come
# from, and how to move the Odin pin.
name: test

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The Windows runner's git converts line endings on checkout; leita's
      # tests that compare file bytes would otherwise read CRLF where they
      # wrote LF.
      - name: keep line endings as committed (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # jm is a submodule, over https so the runner needs no key for it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      # Odin, just, SDL3 on Linux and jm's native libraries, cached.
      - uses: ./.github/actions/setup

      # Diagnostic only: every gui/app test, one at a time.
      # Four small scans together reach Done. The suite's width may be what
      # pushes the rest past the thirty second wait.
      - name: focused scan diagnostic
        timeout-minutes: 20
        run: |
          mkdir -p build/test/app
          read -r -a build_flags <<< "$(just --evaluate flags)"
          log=build/test/app/diagnostic.log
          set +e
          odin test gui/app -debug "${build_flags[@]}" -out:build/test/app/Leita.exe \
            -define:ODIN_TEST_THREADS=1 >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          grep -E "Finished [1-9][0-9]* tests" "$log"
          exit "$status"
