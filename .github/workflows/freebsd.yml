# This job produces a CLI candidate, never an update feed or a published release.
# Native UFS/ZFS fixture acceptance remains a separate gate (card 881).
name: freebsd-cli

on:
  push:
    branches: [main, "ci/**", "freebsd/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: FreeBSD 15.1 amd64 CLI
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          arch: amd64
          mem: 4096
          cpu: 4
          prepare: |
            pkg install -y bash curl git gmake just llvm22 python3
          # Return success to the VM action so it copies evidence back even
          # when setup/tests fail. The host enforces the recorded status below.
          run: sh tools/freebsd/record-gate build/freebsd/gate-status sh tools/freebsd/vm
      - name: Native CLI candidate and build metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freebsd-15.1-amd64-cli-candidate
          path: |
            build/package/*freebsd-amd64.tar.gz
            build/package/*freebsd-amd64.tar.gz.sha256
            build/freebsd/fixtures
            build/freebsd/progress.jsonl
            build/freebsd/gate-status
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce native gate result
        if: always()
        run: python3 tools/freebsd/check_gate.py build/freebsd/gate-status
