# Bounded parser fuzz on Linux. test.yml is the correctness matrix and is left
# alone; this workflow is the only fuzz job. The budget is a fixed seed, a
# fixed case count and a wall clock, so a run is deterministic and cannot
# grow. Suites replay the corpus committed beside them. A crash leaves a
# breadcrumb there for the next run; committing that case is a person's job.
name: fuzz

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The tree suite builds mounts in a user namespace. Ubuntu 24.04 refuses
      # one to a process without an AppArmor profile; where the sysctl is not
      # there or cannot be set, the suite says it skipped its mounts.
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The same command as a local run: just fuzz [suite] [seed] [duration].
      # It prints the seed first and, on a failure, the command that replays it.
      - name: fuzz
        timeout-minutes: 10
        run: just fuzz
      # The push-time seed set for the filesystem suite: seed 1 ran above with
      # every suite; these are four more, a fixed 128 cases each, so a run is
      # the same every time and stays under a minute.
      - name: fuzz tree seeds
        timeout-minutes: 10
        run: |
          for seed in 2 3 4 5; do
            just fuzz tree "$seed" 0 -iters=128
          done
      # A failing case is saved beside its suite. The runner is thrown away,
      # so keep the cases for a person to commit.
      - name: keep failing cases
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-cases
          path: "*/fuzz/corpus/*.case"
          if-no-files-found: ignore
