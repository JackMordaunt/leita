# Bounded fuzz on Linux, macOS and Windows. test.yml is the correctness matrix
# and is left alone; this workflow is the only fuzz job. On a push the budget is
# fixed seeds, a fixed case count and a wall clock, so a run is deterministic and
# cannot grow. Nightly, and on a dispatch that asks for it, the same legs run
# every suite, and the tree and gui suites, for longer, on seeds drawn from the
# date, so each night covers cases no push does and a failure can still be
# replayed.
# Suites replay the corpus committed beside them first. A failure saves its
# shrunk case there; the runner keeps the new ones as an artifact, and
# committing one to the corpus is a person's job.
name: fuzz

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: run the nightly long budget too
        type: boolean
        default: false

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the oldest macOS GitHub hosts, macos-latest the newest.
        # The tree suite builds its specs on APFS disk images there.
        os: [ubuntu-latest, macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The tree suite builds mounts in a user namespace. Ubuntu 24.04 refuses
      # one to a process without an AppArmor profile; where the sysctl is not
      # there or cannot be set, the suite says it skipped its mounts.
      - name: allow user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The same command as a local run: just fuzz [suite] [seed] [duration].
      # It prints the seed first and, on a failure, the command that replays it.
      - name: fuzz
        timeout-minutes: 20
        run: just fuzz
      # The push-time seed set for the filesystem suite: seed 1 ran above with
      # every suite; these are four more, a fixed 128 cases each, so a run is
      # the same every time and stays under a minute on Linux. On macOS each
      # mount is a disk image attached, and the set takes a few minutes.
      - name: fuzz tree seeds
        timeout-minutes: 10
        run: just fuzz tree 2,3,4,5 0 -iters=128
      # The push-time seed set for the window: seed 1 ran above for 2m; these
      # are two more, a fixed 6 cases each. A case drives the window through
      # up to 40 actions on the made-up disk and takes seconds, and a failure
      # shrinks for minutes more.
      - name: fuzz gui seeds
        timeout-minutes: 30
        run: just fuzz gui 2,3 0 -iters=6
      # The nightly budget: every suite for 5m on a seed of the date, then the
      # tree suite for 10m on each of six more, and the gui suite for 15m on
      # two. The seeds are printed, and just fuzz SUITE SEED 0 -iters=N
      # replays a failure from them.
      - name: fuzz nightly
        if: github.event_name == 'schedule' || inputs.nightly
        timeout-minutes: 170
        run: |
          day=$(date -u +%Y%m%d)
          status=0
          just fuzz "" "${day}0" 5m || status=1
          just fuzz tree "${day}1,${day}2,${day}3,${day}4,${day}5,${day}6" 10m || status=1
          just fuzz gui "${day}7,${day}8" 15m || status=1
          exit "$status"
      # A failing case is saved, shrunk, beside its suite. The runner is thrown
      # away, so keep the new cases for a person to commit to the corpus.
      - name: gather failing cases
        if: failure()
        run: tools/new-fuzz-cases build/fuzz-cases
      - name: keep failing cases
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-cases-${{ matrix.os }}
          path: build/fuzz-cases
          if-no-files-found: ignore

  # The same recipe on Windows, where tools/in-namespace hands the run to
  # tools/ntfs-volumes: the runner is an administrator, so the tree suite builds
  # on NTFS volumes of a VHDX, with junctions and mount points, and compares
  # the MFT reader with the walk. ASan is off on Windows, as in test.yml.
  fuzz-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: fuzz
        timeout-minutes: 20
        run: SAN='' just fuzz
      - name: fuzz tree seeds
        timeout-minutes: 15
        run: SAN='' just fuzz tree 2,3,4,5 0 -iters=128
      - name: fuzz gui seeds
        timeout-minutes: 30
        run: SAN='' just fuzz gui 2,3 0 -iters=6
      - name: fuzz nightly
        if: github.event_name == 'schedule' || inputs.nightly
        timeout-minutes: 170
        run: |
          day=$(date -u +%Y%m%d)
          status=0
          SAN='' just fuzz "" "${day}0" 5m || status=1
          SAN='' just fuzz tree "${day}1,${day}2,${day}3,${day}4,${day}5,${day}6" 10m || status=1
          SAN='' just fuzz gui "${day}7,${day}8" 15m || status=1
          exit "$status"
      - name: gather failing cases
        if: failure()
        run: tools/new-fuzz-cases build/fuzz-cases
      - name: keep failing cases
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-cases-windows
          path: build/fuzz-cases
          if-no-files-found: ignore
