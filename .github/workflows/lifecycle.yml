# Native lifecycle evidence on Linux, macOS and Windows, for the same commits
# test.yml builds. A required case that is missing, blocked or failed fails
# this job. The release workflow publishes only when the job for that commit
# succeeded and its evidence passes the gate again.
#
# tools/test-licence-lifecycle and tools/test-schedule-lifecycle, when they
# exist, write evidence-*.json into the same directory before the gate runs.
# This workflow does not invent their results. Fixture runs do not read
# production secrets.
name: lifecycle

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lifecycle-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: keep line endings as committed (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup

      - name: this commit
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]

      - name: gate unit tests
        run: python -m unittest discover -s tools/test-lifecycle -p 'test_*.py'

      - name: archive tools
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd rpm cpio
          elif [ "$RUNNER_OS" = macOS ]; then
            if ! command -v zstd >/dev/null; then brew install zstd; fi
          fi

      # Sibling producers join by writing evidence-*.json. Absence is not a
      # pass: the gate fails closed on the cases they own.
      - name: sibling evidence
        env:
          LIFECYCLE_DIR: build/lifecycle
          LIFECYCLE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$LIFECYCLE_DIR"
          if command -v python3 >/dev/null 2>&1; then py=python3; else py=python; fi
          status=0
          if [ -f tools/test-licence-lifecycle/harness.py ]; then
            "$py" tools/test-licence-lifecycle/harness.py || status=1
          fi
          if [ -f tools/test-schedule-lifecycle/harness.py ]; then
            "$py" tools/test-schedule-lifecycle/harness.py || status=1
          fi
          exit "$status"

      # As release.yml: zig links the Linux build at the glibc floor, which
      # the packages need (just package refuses a binary that loads libstdc++).
      - name: zig (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=0.17.0
          case "$(uname -m)" in
            x86_64) arch=x86_64 sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
            aarch64) arch=aarch64 sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            *) echo "::error::no zig is pinned for $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL --max-time 300 -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ver/zig-$arch-linux-$ver.tar.xz"
          echo "$sum  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$arch-linux-$ver" >> "$GITHUB_PATH"

      - name: lifecycle
        # Collect updater evidence even when a sibling failed; the job and
        # gate still fail, while artifacts show every independent result.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          LIFECYCLE_DIR: build/lifecycle
          LIFECYCLE_SHA: ${{ github.sha }}
          # Empty off Linux, where there are no packages.
          LEITA_PACKAGE_FLOOR: ${{ runner.os == 'Linux' && '2.35' || '' }}
        run: just lifecycle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lifecycle-${{ runner.os }}
          if-no-files-found: warn
          path: |
            build/lifecycle/evidence.json
            build/lifecycle/evidence-*.json
